# Woodpecker CI for damson. Runs on the self-hosted Woodpecker on the kerbol k8s cluster.
# Temporary: it stays until the repo moves to GitHub.
#
# Steps run sequentially; a failed GATING step aborts the pipeline, so build/release only
# proceed when the gating tests pass. Non-gating suites use `failure: ignore`. The image build
# AND the gitops image-bump both happen HERE, via a direct git push.
#
# Triggers:
#   pull_request           -> tests only
#   push to main           -> tests -> build+push (main-<sha> + latest) -> bump damson-test
#   tag v*.*.*             -> promote the already-tested main-<sha> to vX.Y.Z/X.Y/X -> bump damson (prod)
#
# Source and image both live on Forgejo: git.smol.cloud/telliott/damson, the image in the
# registry beside the repo, as munar-gateway and liaotian do. The gitops bump still pushes to
# GitHub — gitops stays there — so it clones over its own token rather than reusing the checkout.
#
# Requires, set once as repo admin:
#   - the repo enabled with trustedSecurity, for the buildkit securityContext
#   - GLOBAL secrets (server-wide, so they resolve on both forges), all event-scoped to push+tag:
#       forgejo_user / forgejo_token  a Forgejo token with write:package
#       gitops_token                  PAT with contents:write on the gitops repo
#   - ORG secret sonar_token on `telliott` (events: push):
#       a SonarQube global analysis token for sonar.smol.cloud (see the `sonar` step)

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: damson
      POSTGRES_PASSWORD: damson
      POSTGRES_DB: damson

steps:
  go:
    # Skip on tag: a release is a retag of the already-tested main-<sha> image, not a rebuild.
    when:
      - event: pull_request
      - event: push
        branch: main
    image: golang:1.26
    # The whole Go suite runs against Postgres (there is no SQLite backend); each
    # test isolates itself in its own schema on this shared instance.
    environment:
      DAMSON_TEST_POSTGRES_DSN: postgres://damson:damson@postgres:5432/damson?sslmode=disable
    commands:
      - go mod download
      - go mod tidy && git diff --exit-code -- go.mod go.sum
      - test -z "$(gofmt -l .)" || { echo 'gofmt issues:'; gofmt -l .; exit 1; }
      - go vet ./...
      - go tool golangci-lint run ./...
      - bash -c 'until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do echo "waiting for postgres"; sleep 1; done'
      # coverage.out feeds the `sonar` step (sonar.go.coverage.reportPaths). -covermode=atomic is
      # not optional under -race: the default `set` mode is not race-safe and will trip the detector.
      # The workspace carries across steps, so nothing needs to be published to hand it over.
      - go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

  web:
    when:
      - event: pull_request
      - event: push
        branch: main
    image: node:24
    commands:
      - corepack enable && corepack prepare pnpm@12.6.0 --activate   # keep in step with mise.toml
      - cd web
      - pnpm install --frozen-lockfile
      - pnpm run lint           # check-tokens, ESLint
      - pnpm run format:check   # Prettier
      - pnpm run build          # includes the tsc -b type check
      - pnpm run test -- --run

  stories:
    when:
      - event: pull_request
      - event: push
        branch: main
    # Every *.stories.tsx in real Chromium with axe-core checks (the `storybook` Vitest project).
    # The Playwright image supplies the browser; its tag follows the same rule as the e2e step's.
    # GATING.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    commands:
      - corepack enable && corepack prepare pnpm@12.6.0 --activate   # keep in step with mise.toml
      - cd web
      - pnpm install --frozen-lockfile
      - pnpm run test:stories -- --run

  e2e-build:
    when:
      - event: pull_request
      - event: push
        branch: main
    image: golang:1.26
    commands:
      - mkdir -p web/e2e/.bin
      - go build -o web/e2e/.bin/damson-e2e ./cmd/e2e-server

  e2e:
    when:
      - event: pull_request
      - event: push
        branch: main
    # Pre-baked Playwright image (Chromium + system deps already installed) instead of node:24 +
    # `playwright install`. The runtime browser download wedges forever on a stalled CDN socket /
    # stale dirlock with no timeout (this is what hung GitHub Actions for 6h on a cache miss).
    # Image tag MUST match @playwright/test in web/package.json (pinned exactly)
    # so the bundled browsers are found. Bumping Playwright in the app => bump this tag.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    # The e2e-server is Postgres-only, so the suite runs in Postgres mode against
    # the shared service. GATING.
    environment:
      CI: "true" # playwright.config keys off it (reuseExistingServer:!CI, CI reporter)
      DAMSON_TEST_POSTGRES_DSN: postgres://damson:damson@postgres:5432/damson?sslmode=disable
    commands:
      - corepack enable && corepack prepare pnpm@12.6.0 --activate   # keep in step with mise.toml
      - cd web
      - pnpm install --frozen-lockfile
      - bash -c 'until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do sleep 1; done'
      - pnpm run e2e

  build-push:
    # buildkit-rootless on the kerbol k8s backend (no docker daemon; replaces DooD). securityContext
    # via backend_options needs the repo's trusted-security capability. Registry-side layer cache.
    image: moby/buildkit:rootless
    when:
      - event: push
        branch: main
    backend_options:
      kubernetes:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    commands:
      - export TAG="main-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - export DOCKER_CONFIG="$HOME/.docker" && mkdir -p "$DOCKER_CONFIG"
      - echo "{\"auths\":{\"git.smol.cloud\":{\"auth\":\"$(echo -n "$FORGEJO_USER:$FORGEJO_TOKEN" | base64 | tr -d '\n')\"}}}" > "$DOCKER_CONFIG/config.json"
      - |
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=. --local dockerfile=. \
          --output type=image,\"name=git.smol.cloud/telliott/damson:$TAG,git.smol.cloud/telliott/damson:latest\",push=true \
          --import-cache type=registry,ref=git.smol.cloud/telliott/damson:buildcache \
          --export-cache type=registry,ref=git.smol.cloud/telliott/damson:buildcache,mode=max

  bump-test:
    image: alpine:3.20
    when:
      - event: push
        branch: main
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - apk add --no-cache git curl
      - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
      - TAG="main-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - git clone --depth 1 "https://x-access-token:$GITOPS_TOKEN@github.com/thomas-elliott/gitops.git" gitops
      - cd gitops
      # test env is now the kerbol k8s cluster (ArgoCD watches k8s/); bump the kustomize image tag.
      - TAG="$TAG" yq -i '(.images[] | select(.name == "git.smol.cloud/telliott/damson")).newTag = strenv(TAG)' k8s/test/damson/kustomization.yaml
      - git config user.email thomaselliott@outlook.com
      - git config user.name 'woodpecker[bot]'
      - git diff --quiet || { git commit -am "bump damson-test -> $TAG"; git push; }

  sonar:
    # Advisory static analysis -> sonar.smol.cloud (project key `damson`). Config that isn't a
    # secret lives in sonar-project.properties next to this file.
    #
    # ADVISORY means exactly that: `failure: ignore`, so neither a failed quality gate nor a
    # SonarQube outage can hold up a release. It also runs LAST on the push path, after the image
    # is built and the test env bumped, so a slow scan delays nothing that matters.
    #
    # push-to-main only. SonarQube Community Build analyses a single branch — there is no PR
    # analysis in this edition — so scanning a PR would overwrite main's results with the branch's.
    #
    # Reached by in-cluster Service DNS, not https://sonar.smol.cloud: no TLS, no split-horizon
    # DNS, no hairpin back out through Traefik. The consequence: the "you can find the results at
    # …" line the scanner prints carries that in-cluster URL, which no browser can reach. The
    # results are at https://sonar.smol.cloud/dashboard?id=damson.
    image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    when:
      - event: push
        branch: main
    failure: ignore
    environment:
      SONAR_HOST_URL: http://sonarqube.sonarqube-prod.svc.cluster.local:9000
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      # The image runs as uid 1000 but earlier steps wrote the workspace as root, so the scanner
      # cannot create its .scannerwork/ scratch dir in place — put it on /tmp instead.
      - >
        sonar-scanner
        -Dsonar.working.directory=/tmp/.scannerwork
        -Dsonar.projectVersion="$(cat VERSION)"

  release-promote:
    # crane:debug ships no /bin/sh, but Woodpecker runs step commands through
    # /bin/sh -> the container can't start. Run crane from alpine instead.
    image: alpine:3.20
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache git curl
      - curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.21.6/go-containerregistry_Linux_x86_64.tar.gz -o /tmp/crane.tgz
      - tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
      # promote the already-built+tested main-<sha> image to the version tags (no rebuild)
      - VER="${CI_COMMIT_TAG#v}"
      # Resolve the commit from the ref, not from CI_COMMIT_SHA: on a tag event that variable is the
      # annotated tag object's SHA, not the commit, so main-<sha7> would name an image no build ever
      # pushed. Lightweight tags happen to work either way. Same form as liaotian's prod promote.
      - COMMIT_SHA="$(git rev-list -n 1 "$CI_COMMIT_REF")"
      - SRC="git.smol.cloud/telliott/damson:main-$(echo "$COMMIT_SHA" | cut -c1-7)"
      # --password-stdin, not -p: -p puts the token on a real process's command line.
      - echo "$FORGEJO_TOKEN" | crane auth login git.smol.cloud -u "$FORGEJO_USER" --password-stdin
      - crane manifest "$SRC" >/dev/null   # the tagged commit must have been built on main
      - crane tag "$SRC" "$VER"
      - crane tag "$SRC" "$(echo "$VER" | cut -d. -f1-2)"
      - crane tag "$SRC" "$(echo "$VER" | cut -d. -f1)"

  release-bump:
    image: alpine:3.20
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - apk add --no-cache git curl
      - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
      - IMAGE_REF="git.smol.cloud/telliott/damson:${CI_COMMIT_TAG#v}"
      - git clone --depth 1 "https://x-access-token:$GITOPS_TOKEN@github.com/thomas-elliott/gitops.git" gitops
      - cd gitops
      - NEWTAG="${CI_COMMIT_TAG#v}" yq -i '(.images[] | select(.name == "git.smol.cloud/telliott/damson")).newTag = strenv(NEWTAG)' k8s/prod/damson/kustomization.yaml
      - git config user.email thomaselliott@outlook.com
      - git config user.name 'woodpecker[bot]'
      - git diff --quiet || { git commit -am "release damson -> $IMAGE_REF"; git push; }
