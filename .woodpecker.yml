# Woodpecker CI for damson — replaces .github/workflows/{tests,build,release}.yml after
# GitHub Actions minutes were exhausted. Runs on the self-hosted Woodpecker on tylo.
#
# Steps run sequentially; a failed GATING step aborts the pipeline, so build/release only
# proceed when the gating tests pass. Non-gating suites use `failure: ignore` (parity with
# the GHA continue-on-error jobs). The image build AND the gitops image-bump happen HERE via
# a direct git push (NOT a repository_dispatch) so nothing re-runs in GitHub Actions.
#
# Triggers (mirrors the GHA workflows):
#   pull_request           -> tests only
#   push to main           -> tests -> build+push (main-<sha> + latest) -> bump damson-test
#   tag v*.*.*             -> tests -> promote main-<sha> to vX.Y.Z/X.Y/X -> bump damson (prod)
#
# Requires (set once, in the Woodpecker UI, as repo admin):
#   - damson repo marked TRUSTED (the build step mounts the host docker socket).
#   - repo secrets:
#       ghcr_token    PAT with write:packages (push images to ghcr.io/thomas-elliott/damson)
#       gitops_token  PAT with contents:write on the gitops repo (the existing GITOPS_DISPATCH_TOKEN works)

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: damson
      POSTGRES_PASSWORD: damson
      POSTGRES_DB: damson

steps:
  go:
    image: golang:1.26
    commands:
      - go mod download
      - go mod tidy && git diff --exit-code -- go.mod go.sum
      - test -z "$(gofmt -l .)" || { echo 'gofmt issues:'; gofmt -l .; exit 1; }
      - go vet ./...
      - go test -race -count=1 ./...

  web:
    image: node:24
    commands:
      - cd web
      - npm ci
      - npm run build           # includes the tsc -b type check
      - npm test -- --run

  integration:
    image: golang:1.26
    failure: ignore             # non-gating (GHA continue-on-error)
    environment:
      DAMSON_TEST_POSTGRES_DSN: postgres://damson:damson@postgres:5432/damson?sslmode=disable
    commands:
      - bash -c 'until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do echo "waiting for postgres"; sleep 1; done'
      - go test -tags=postgres_integration -race -count=1 ./...

  e2e-build:
    image: golang:1.26
    commands:
      - mkdir -p web/e2e/.bin
      - go build -o web/e2e/.bin/damson-e2e ./cmd/e2e-server

  e2e:
    # Pre-baked Playwright image (Chromium + system deps already installed) instead of node:24 +
    # `playwright install`. The runtime browser download wedges forever on a stalled CDN socket /
    # stale dirlock with no timeout (this is what hung GitHub Actions for 6h on a cache miss).
    # Image tag MUST match @playwright/test in web/package-lock.json (1.59.1) so the bundled
    # browsers are found. Bumping Playwright in the app => bump this tag.
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    environment:
      CI: "true" # playwright.config keys off it (reuseExistingServer:!CI, CI reporter)
    commands:
      - cd web
      - npm ci
      - npm run e2e                                            # sqlite mode — GATING
      # postgres mode is non-gating (GHA continue-on-error): the `|| echo` swallows its failure
      - bash -c 'until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do sleep 1; done'
      - DAMSON_TEST_POSTGRES_DSN=postgres://damson:damson@postgres:5432/damson?sslmode=disable npm run e2e || echo "postgres-mode e2e failed (non-gating)"

  build-push:
    image: docker:27-cli
    when:
      - event: push
        branch: main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # reuses tylo's daemon layer cache; needs repo=TRUSTED
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - TAG="main-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u thomas-elliott --password-stdin
      - docker build -t "ghcr.io/thomas-elliott/damson:$TAG" -t ghcr.io/thomas-elliott/damson:latest .
      - docker push "ghcr.io/thomas-elliott/damson:$TAG"
      - docker push ghcr.io/thomas-elliott/damson:latest

  bump-test:
    image: alpine:3.20
    when:
      - event: push
        branch: main
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - apk add --no-cache git curl
      - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
      - IMAGE_REF="ghcr.io/thomas-elliott/damson:main-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - git clone --depth 1 "https://x-access-token:$GITOPS_TOKEN@github.com/thomas-elliott/gitops.git" gitops
      - cd gitops
      - IMAGE_REF="$IMAGE_REF" yq -i '.services.damson.image = strenv(IMAGE_REF)' projects/damson-test/compose.yaml
      - git config user.email thomaselliott@outlook.com
      - git config user.name 'woodpecker[bot]'
      - git diff --quiet || { git commit -am "bump damson-test -> $IMAGE_REF"; git push; }

  release-promote:
    image: gcr.io/go-containerregistry/crane:debug
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      # promote the already-built+tested main-<sha> image to the version tags (no rebuild)
      - VER="${CI_COMMIT_TAG#v}"
      - SRC="ghcr.io/thomas-elliott/damson:main-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - crane auth login ghcr.io -u thomas-elliott -p "$GHCR_TOKEN"
      - crane manifest "$SRC" >/dev/null   # the tagged commit must have been built on main
      - crane tag "$SRC" "$VER"
      - crane tag "$SRC" "$(echo "$VER" | cut -d. -f1-2)"
      - crane tag "$SRC" "$(echo "$VER" | cut -d. -f1)"

  release-bump:
    image: alpine:3.20
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - apk add --no-cache git curl
      - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
      - IMAGE_REF="ghcr.io/thomas-elliott/damson:${CI_COMMIT_TAG#v}"
      - git clone --depth 1 "https://x-access-token:$GITOPS_TOKEN@github.com/thomas-elliott/gitops.git" gitops
      - cd gitops
      - IMAGE_REF="$IMAGE_REF" yq -i '.services.damson.image = strenv(IMAGE_REF)' projects/damson/compose.yaml
      - git config user.email thomaselliott@outlook.com
      - git config user.name 'woodpecker[bot]'
      - git diff --quiet || { git commit -am "release damson -> $IMAGE_REF"; git push; }
