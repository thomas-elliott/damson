name: Feature request
description: Something Damson should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. What Damson should do about it is a decision;
        what you were trying to get done is a fact that cannot be reconstructed
        later.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The task, not the feature. "I need to find every pack that forbids
        commercial use before we ship" tells us more than "add a filter".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: >-
        The API call, the workaround, the spreadsheet, or "I can't". Some gaps
        already have an API-only path; see the
        [how-tos](https://github.com/thomas-elliott/damson/blob/main/docs/how-to/README.md).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
      description: Optional. A rough shape is fine.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >-
        Scale it needs to work at, how often you hit this, or a tool that does
        this well.
