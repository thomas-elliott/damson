name: Bug report
description: Something in Damson does not do what it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Damson is pre-alpha. Report any gap that is not already named as a known
        gap in the
        [how-tos](https://github.com/thomas-elliott/damson/blob/main/docs/how-to/README.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I uploaded a .unitypackage with …
        I expected …
        Instead …
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        The shortest path from a fresh install to the problem. If it only
        happens with a particular file, say what kind of file.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The image tag you are running, or the commit you built from.
        `/api/health` reports `"dev"` for the published images, so use the tag.
      placeholder: "ghcr.io/thomas-elliott/damson:0.4.0"
    validations:
      required: true

  - type: dropdown
    id: auth-mode
    attributes:
      label: Auth mode
      description: "`DAMSON_AUTH_MODE`"
      options:
        - local (default)
        - oidc
    validations:
      required: true

  - type: dropdown
    id: storage-mode
    attributes:
      label: Storage mode
      description: "`DAMSON_STORAGE_MODE`"
      options:
        - local (default)
        - s3
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Web UI
        - HTTP API
        - dmsn CLI
        - Server startup / configuration
        - Import or preview pipeline
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Damson logs JSON. The lines around the failure, with any `request_id`
        intact, are usually enough. See
        [docs/observability.md](https://github.com/thomas-elliott/damson/blob/main/docs/observability.md).
        Remove anything you would rather not publish before pasting.
      render: text

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >-
        Reverse proxy, non-default configuration, library size, or anything else
        that might matter.
