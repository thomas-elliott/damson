name: Documentation problem
description: A doc is wrong, missing, or sent you the wrong way.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Report a command that does not work, a config key that does not exist, a
        step that assumes something the page never said, or a correct page that
        left you stuck.

  - type: input
    id: page
    attributes:
      label: Which page
      description: A path or a link, plus the heading if the page is long.
      placeholder: "docs/getting-started.md § Bootstrapping the first admin"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: >-
        What it says, and what you found to be true instead. If a command
        failed, paste it with its output.
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: What were you trying to do?
      description: >-
        Optional. This is how a missing page gets written instead of an existing
        one patched.
