name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build & push (release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auto-update the laythe prod env: pin projects/damson to the immutable X.Y.Z image
      # just published. Arcane's autoSync redeploys within ~5 min (mirrors the test-env
      # main-<sha> bump in main-build.yml, but fires the semver tag on release).
      - name: Trigger gitops bump (prod env)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "GITOPS_DISPATCH_TOKEN not set — skipping prod bump"; exit 0; fi
          REF=$(printf '%s' "$META_JSON" | jq -r '.tags[] | select(test(":[0-9]+[.][0-9]+[.][0-9]+$"))' | head -n1)
          test -n "$REF" || { echo "::error::no X.Y.Z tag in metadata"; exit 1; }
          jq -nc --arg ref "$REF" \
            '{event_type:"bump-image", client_payload:{project:"damson", service:"damson", image_ref:$ref}}' \
            | gh api repos/thomas-elliott/gitops/dispatches --method POST --input -

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
