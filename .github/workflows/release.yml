name: Release (promote to prod)

# Production release, triggered by publishing a GitHub Release:
#   Releases -> Draft a new release -> choose the target (a tested main commit),
#   set the tag to vX.Y.Z, "Generate release notes", Publish.
# (Or: gh release create vX.Y.Z --target <main-sha> --generate-notes)
#
# Does NOT rebuild. It promotes the image that was already built, tested, and
# running on the test environment (build.yml pushes `main-<sha>` on every main
# merge) by adding the release's version tags to that same digest, then points
# the prod gitops env at it.

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote tested image to production
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + verify the commit is on main
      actions: read # read tests.yml run status
      packages: write # add version tags to the existing image

    steps:
      - name: Validate release tag
        run: |
          V="${{ github.event.release.tag_name }}"
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vX.Y.Z (got '$V')"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and verify commit
        id: resolve
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::release commit $SHA is not on main — only release commits that landed on main"; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Assert CI is green for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?head_sha=$SHA" \
            --jq 'first(.workflow_runs[] | select(.status=="completed")) | .conclusion // empty')
          echo "tests.yml conclusion for $SHA: ${CONCLUSION:-<none>}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::tests.yml has not passed for $SHA (got '${CONCLUSION:-none}'); refusing to release"; exit 1
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image (retag existing digest)
        id: promote
        run: |
          set -euo pipefail
          SRC="$REGISTRY/$IMAGE_NAME:main-${{ steps.resolve.outputs.short }}"
          if ! docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
            echo "::error::$SRC not found — was this commit built by build.yml? (only merged-to-main commits have an image)"; exit 1
          fi
          NUM="${{ github.event.release.tag_name }}"; NUM="${NUM#v}"
          MAJOR="${NUM%%.*}"; MINOR="${NUM%.*}"
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE_NAME:$NUM" \
            -t "$REGISTRY/$IMAGE_NAME:$MINOR" \
            -t "$REGISTRY/$IMAGE_NAME:$MAJOR" \
            "$SRC"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "Promoted $SRC -> :$NUM :$MINOR :$MAJOR"

      # Point the prod env at the immutable version tag just published.
      # Arcane's autoSync redeploys within ~5 min.
      - name: Trigger gitops bump (prod env)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "GITOPS_DISPATCH_TOKEN not set — skipping prod bump"; exit 0; fi
          REF="$REGISTRY/$IMAGE_NAME:${{ steps.promote.outputs.num }}"
          jq -nc --arg ref "$REF" \
            '{event_type:"bump-image", client_payload:{project:"damson", service:"damson", image_ref:$ref}}' \
            | gh api repos/thomas-elliott/gitops/dispatches --method POST --input -
