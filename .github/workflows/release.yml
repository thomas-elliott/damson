# Promotes a tested image to a version. Pushing a vX.Y.Z tag (`just release tag vX.Y.Z`) adds the
# tags X.Y.Z, X.Y and X to the main-<sha7> image that ci.yml built and tested for that commit. It
# runs no tests and builds nothing, so the release is the exact image that passed CI.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag main-<sha7> with the version
        run: |
          IMAGE="ghcr.io/$GITHUB_REPOSITORY"
          # HEAD, not GITHUB_SHA: on an annotated tag the latter can be the tag object, not the commit.
          SHA="$(git rev-parse HEAD)"
          SRC="$IMAGE:main-${SHA::7}"
          docker buildx imagetools inspect "$SRC" >/dev/null \
            || { echo "::error::$SRC does not exist. Only commits CI built on main can be released."; exit 1; }
          VER="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$IMAGE:$VER" \
            -t "$IMAGE:${VER%.*}" \
            -t "$IMAGE:${VER%%.*}" \
            "$SRC"
