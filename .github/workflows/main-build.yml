name: Main Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auto-update the tylo test env: tell the gitops repo to pin damson-test to the
      # immutable main-<sha> just pushed. Arcane's autoSync redeploys within ~5 min.
      - name: Trigger gitops bump (test env)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "GITOPS_DISPATCH_TOKEN not set — skipping test-env bump"; exit 0; fi
          REF=$(printf '%s' "$META_JSON" | jq -r '.tags[] | select(contains(":main-"))' | head -n1)
          test -n "$REF" || { echo "::error::no main-<sha> tag in metadata"; exit 1; }
          jq -nc --arg ref "$REF" \
            '{event_type:"bump-image", client_payload:{project:"damson-test", service:"damson", image_ref:$ref}}' \
            | gh api repos/thomas-elliott/gitops/dispatches --method POST --input -
