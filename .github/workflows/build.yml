name: Build (main)

# Builds and pushes the `latest` + `main-<sha>` container image on every update
# to main so it can be pulled into the test environment. Production releases are
# handled separately by release.yml, which promotes one of these tested images
# (no rebuild) by adding the version tags.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Only keep the newest build for a given ref; cancel superseded ones.
concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only. release.yml promotes this exact image to prod, so prod
          # runs the same single-arch artifact that was tested.
          platforms: linux/amd64

      # Auto-update the test env: pin damson-test to the immutable main-<sha>
      # just pushed. Arcane's autoSync redeploys within ~5 min.
      - name: Trigger gitops bump (test env)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "GITOPS_DISPATCH_TOKEN not set — skipping test-env bump"; exit 0; fi
          REF=$(printf '%s' "$META_JSON" | jq -r '.tags[] | select(contains(":main-"))' | head -n1)
          test -n "$REF" || { echo "::error::no main-<sha> tag in metadata"; exit 1; }
          jq -nc --arg ref "$REF" \
            '{event_type:"bump-image", client_payload:{project:"damson-test", service:"damson", image_ref:$ref}}' \
            | gh api repos/thomas-elliott/gitops/dispatches --method POST --input -
