name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (test & lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  integration:
    # Postgres-backed integration tests. Non-gating until the suite has
    # soaked — failures are visible on the PR but don't block merge. Promote
    # to required once stable.
    name: Go integration (Postgres)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: damson
          POSTGRES_PASSWORD: damson
          POSTGRES_DB: damson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damson -d damson"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run integration tests
        env:
          DAMSON_TEST_POSTGRES_DSN: postgres://damson:damson@localhost:5432/damson?sslmode=disable
        run: go test -tags=postgres_integration -race -count=1 ./...

  web:
    name: Web (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript check)
        run: npm run build

      - name: Test
        run: npm test -- --run

  e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build e2e-server binary
        run: |
          mkdir -p web/e2e/.bin
          go build -o web/e2e/.bin/damson-e2e ./cmd/e2e-server

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Cache Playwright browser binaries between runs. Keyed on the
      # lockfile so an upgrade to @playwright/test invalidates cleanly.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  e2e-postgres:
    # Same Playwright suite, but the e2e binary picks Postgres when
    # DAMSON_TEST_POSTGRES_DSN is set — that surfaces the PER-81 search
    # spec which gates on the same env var. Non-gating while the
    # Postgres-mode reset path soaks; promote to required once stable.
    name: Web E2E (Playwright, Postgres)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: damson
          POSTGRES_PASSWORD: damson
          POSTGRES_DB: damson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damson -d damson"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build e2e-server binary
        run: |
          mkdir -p web/e2e/.bin
          go build -o web/e2e/.bin/damson-e2e ./cmd/e2e-server

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run E2E against Postgres
        working-directory: web
        env:
          DAMSON_TEST_POSTGRES_DSN: postgres://damson:damson@localhost:5432/damson?sslmode=disable
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-postgres
          path: web/playwright-report/
          retention-days: 14