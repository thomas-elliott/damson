# SonarQube Community Build — https://sonar.smol.cloud, project key `damson`.
# Read by the `sonar` step in .woodpecker.yml. Non-secret settings only: the host URL and the
# analysis token are supplied by that step as SONAR_HOST_URL / SONAR_TOKEN.
#
# Everything under sonar.* that is not here is left at the server's default, including the
# quality gate ("Sonar way"). Analysis is advisory — the CI step never fails on the gate.

sonar.projectKey=damson
sonar.sourceEncoding=UTF-8

sonar.sources=.

# Go test files sit beside the code they test, so they cannot be split off by directory the way
# sonar.tests expects. Separating them by pattern keeps test code out of the main-code metrics
# (duplication and complexity in a table-driven test are not defects) while still analysing it.
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/e2e/**

# Build output and vendored code. These are generated or third-party, so findings in them are
# noise that nobody can act on.
sonar.exclusions=web/node_modules/**,web/dist/**,web/e2e/.bin/**,web/playwright-report/**,web/test-results/**,**/*.tsbuildinfo,tmp/**

# Written by the `go` step (go test -coverprofile). Relative to this file.
sonar.go.coverage.reportPaths=coverage.out
