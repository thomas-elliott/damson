<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damson</title>
    <!-- Blocking on purpose: light is the base theme, so a dark user sees a white
         flash if this waits for React. The catch falls back to dark rather than
         light — localStorage and matchMedia both throw under some privacy modes. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("damson.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
