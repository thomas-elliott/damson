<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damson</title>
    <!-- Blocking on purpose: light is the CSS base theme but dark is the default,
         so this must add `dark` before first paint or everyone sees a white flash.
         The catch also lands on dark: localStorage throws under some privacy modes. -->
    <script>
      (function () {
        try {
          if (window.localStorage.getItem("damson.theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
