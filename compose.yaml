# Postgres for local development and the test suites — `just db up`.
#
# One server per checkout holds both databases: `damson` for `just dev` and
# `damson_test` for the Go and e2e suites. `just db` names the compose project
# after the checkout's path, so every clone and worktree gets its own server,
# and Docker picks a free loopback port that `just db dsn` reads back. Run it
# through `just db`, not plain `docker compose`. To use your own Postgres
# instead, set DAMSON_POSTGRES_DSN / DAMSON_TEST_POSTGRES_DSN (in `.env` or the
# environment) and skip this file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: damson
      POSTGRES_PASSWORD: damson
      POSTGRES_DB: damson
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./database/dev/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damson -d damson"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres:
