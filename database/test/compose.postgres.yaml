# Postgres fixture used by `task test:integration`. Bound on a non-default
# port (55432) so it doesn't collide with a system Postgres on 5432. CI uses
# GitHub Actions' native `services: postgres` instead of this file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: damson
      POSTGRES_PASSWORD: damson
      POSTGRES_DB: damson
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damson -d damson"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
