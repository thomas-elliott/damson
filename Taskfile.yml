version: "3"

vars:
  WEB_DIR: web

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies for a fresh clone (Go modules, npm, Playwright browsers)
    cmds:
      - go mod download
      - task: install:web:deps
      - task: test:e2e:install

  install:web:deps:
    desc: Install frontend deps if missing
    internal: true
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm install
    status:
      - test -d node_modules

  # ── Dev servers ────────────────────────────────────────────────────────────
  dev:
    desc: Go server with air hot-reload (API only)
    cmds:
      - air

  dev:spa:
    desc: Backend + Vite SPA in parallel
    deps: [install:web:deps]
    cmds:
      - |
        bash -c '
        set -e
        trap "kill 0" INT TERM
        (cd {{.WEB_DIR}} && npm run dev) &
        air &
        wait
        '

  dev:web:
    desc: Vite dev server only
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run dev

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    desc: Production binary (SPA + Go)
    deps: [build:web]
    cmds:
      - CGO_ENABLED=0 go build -o damson ./cmd/server

  build:web:
    desc: Build SPA into web/static
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  storybook:
    desc: Storybook dev server (design system)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run storybook

  storybook:build:
    desc: Static Storybook build (smoke test)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build-storybook

  # ── Quality: read-only ─────────────────────────────────────────────────────
  check:
    desc: Read-only quality gate (lint + format:check + mod:tidy:check)
    cmds:
      - task: lint
      - task: format:check
      - task: mod:tidy:check

  lint:
    desc: Static analysis (Go vet + ESLint)
    cmds:
      - task: lint:go
      - task: lint:web

  lint:go:
    desc: go vet
    cmds:
      - go vet ./...

  lint:web:
    desc: ESLint
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run lint

  format:check:
    desc: Read-only formatting check (gofmt + Prettier)
    cmds:
      - task: format:check:go
      - task: format:check:web

  format:check:go:
    desc: gofmt -l (fails on unformatted files)
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "unformatted Go files:" >&2
          echo "$out" >&2
          exit 1
        fi

  format:check:web:
    desc: prettier --check
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run format:check

  mod:tidy:check:
    desc: Verify go.mod / go.sum are tidy (matches CI)
    cmds:
      - |
        bash -c '
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! cmp -s go.mod go.mod.bak || ! cmp -s go.sum go.sum.bak; then
            echo "go.mod / go.sum are not tidy. Run: go mod tidy && git add go.mod go.sum" >&2
            diff -u go.mod.bak go.mod >&2 || true
            mv go.mod.bak go.mod
            mv go.sum.bak go.sum
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
        '

  # ── Quality: writes ────────────────────────────────────────────────────────
  format:
    desc: Apply formatting (gofmt + Prettier)
    cmds:
      - task: format:go
      - task: format:web

  format:go:
    desc: go fmt
    cmds:
      - go fmt ./...

  format:web:
    desc: prettier --write
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run format

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    desc: Full test suite (unit + integration + e2e)
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  test:unit:
    desc: Unit tests (Go + Vitest)
    cmds:
      - task: test:unit:go
      - task: test:unit:web

  test:unit:go:
    desc: Go unit tests
    cmds:
      - go test ./...

  test:unit:web:
    desc: Vitest unit tests (jsdom)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm test -- --run

  test:integration:
    desc: Postgres-backed Go integration tests (boots compose Postgres on 55432)
    cmds:
      - |
        bash -c '
          set -euo pipefail
          compose="docker compose -f database/test/compose.postgres.yaml"
          trap "$compose down -v >/dev/null 2>&1 || true" EXIT
          $compose up -d --wait
          export DAMSON_TEST_POSTGRES_DSN="postgres://damson:damson@localhost:55432/damson?sslmode=disable"
          go test -tags=postgres_integration -count=1 -race ./...
        '

  test:e2e:
    desc: Playwright end-to-end tests (boots e2e-server + vite dev internally)
    deps: [install:web:deps, test:e2e:build]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run e2e

  test:e2e:postgres:
    desc: Playwright E2E against a Postgres-backed e2e binary (PER-81 search spec)
    deps: [install:web:deps, test:e2e:build]
    cmds:
      - |
        bash -c '
          set -euo pipefail
          compose="docker compose -f database/test/compose.postgres.yaml"
          trap "$compose down -v >/dev/null 2>&1 || true" EXIT
          $compose up -d --wait
          export DAMSON_TEST_POSTGRES_DSN="postgres://damson:damson@localhost:55432/damson?sslmode=disable"
          cd {{.WEB_DIR}} && npm run e2e
        '

  test:e2e:ui:
    desc: Playwright UI mode (interactive test runner)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run e2e:ui

  test:e2e:install:
    desc: Install Playwright browser binaries (run once after npm install)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run e2e:install

  test:e2e:build:
    desc: Build the e2e test server (cmd/e2e-server) into web/e2e/.bin (SQLite by default; honours DAMSON_TEST_POSTGRES_DSN at runtime)
    cmds:
      - mkdir -p {{.WEB_DIR}}/e2e/.bin
      - go build -o {{.WEB_DIR}}/e2e/.bin/damson-e2e ./cmd/e2e-server

  test:stories:
    desc: Run Storybook stories as Vitest tests (Playwright Chromium)
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run test:stories -- --run

  test:watch:
    desc: Vitest watch mode
    deps: [install:web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm test

  test:coverage:
    desc: Generate coverage.html (Go)
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  # ── Misc ───────────────────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f damson coverage.out coverage.html
      - rm -rf {{.WEB_DIR}}/dist {{.WEB_DIR}}/e2e/.bin {{.WEB_DIR}}/storybook-static {{.WEB_DIR}}/static

  docker:build:
    desc: Container image
    cmds:
      - docker build -t damson:local .

  ci:
    desc: Full preflight (check + unit tests + e2e) — matches CI minus integration
    cmds:
      - task: check
      - task: test:unit
      - task: test:e2e

  # Releases promote the already-tested main image to prod by pushing a vX.Y.Z tag,
  # which triggers the Woodpecker tag pipeline (.woodpecker.yml): it re-runs the
  # full test suite, then promotes the existing main-<sha> image (no rebuild). The
  # helpers below cut the tag from an up-to-date main; they do NOT re-run checks
  # locally.

  release:
    desc: "Publish a GitHub release promoting current main to prod (usage: task release VERSION=v1.2.3). Gated on a pushed, up-to-date main — does not re-run checks locally; Woodpecker tests + promotes on the tag."
    preconditions:
      - sh: '[ -n "{{.VERSION}}" ]'
        msg: "VERSION is required. Usage: task release VERSION=v1.2.3"
      - sh: 'echo "{{.VERSION}}" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: "VERSION must be vX.Y.Z (for example v1.2.3)."
      - sh: "command -v gh >/dev/null"
        msg: "GitHub CLI (gh) is required: https://cli.github.com"
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]'
        msg: "Releases are cut from main. Switch to main first."
    cmds:
      - |
        set -eu
        VERSION="{{.VERSION}}"

        # main must be up to date with the remote (nothing unpushed, not behind).
        git fetch --quiet origin main
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
          echo "Error: local main is not in sync with origin/main — push/pull first." >&2
          exit 1
        fi
        SHA="$(git rev-parse origin/main)"

        # Tag must not already exist on the remote.
        if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
          echo "Error: tag $VERSION already exists on origin." >&2
          exit 1
        fi

        # No local CI gate: GitHub Actions was retired in favour of Woodpecker on
        # tylo (.woodpecker.yml). The tag pipeline re-runs the full test suite, and
        # release-promote guards itself with `crane manifest` on the main-<sha>
        # image — so tagging a commit with no tested image fails safe (no promotion).

        echo "Publishing release $VERSION for ${SHA} ..."
        gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes
        echo "Released $VERSION. The Woodpecker tag pipeline will test and promote the image to prod."

  release:patch:
    desc: Release the next patch version (vX.Y.Z+1) from the latest tag
    cmds:
      - task: release
        vars: { VERSION: "{{.NEXT}}" }
    vars:
      NEXT:
        sh: |
          git fetch --tags --quiet origin
          CUR="$(git tag -l 'v*' --sort=-version:refname | head -1)"
          if [ -z "$CUR" ]; then echo "v0.0.1"; else
            N=${CUR#v}; OLD_IFS="$IFS"; IFS='.'; set -- $N; IFS="$OLD_IFS"
            echo "v$1.$2.$(($3 + 1))"
          fi

  release:minor:
    desc: Release the next minor version (vX.Y+1.0) from the latest tag
    cmds:
      - task: release
        vars: { VERSION: "{{.NEXT}}" }
    vars:
      NEXT:
        sh: |
          git fetch --tags --quiet origin
          CUR="$(git tag -l 'v*' --sort=-version:refname | head -1)"
          if [ -z "$CUR" ]; then echo "v0.1.0"; else
            N=${CUR#v}; OLD_IFS="$IFS"; IFS='.'; set -- $N; IFS="$OLD_IFS"
            echo "v$1.$(($2 + 1)).0"
          fi

  release:major:
    desc: Release the next major version (vX+1.0.0) from the latest tag
    cmds:
      - task: release
        vars: { VERSION: "{{.NEXT}}" }
    vars:
      NEXT:
        sh: |
          git fetch --tags --quiet origin
          CUR="$(git tag -l 'v*' --sort=-version:refname | head -1)"
          if [ -z "$CUR" ]; then echo "v1.0.0"; else
            N=${CUR#v}; OLD_IFS="$IFS"; IFS='.'; set -- $N; IFS="$OLD_IFS"
            echo "v$(($1 + 1)).0.0"
          fi
