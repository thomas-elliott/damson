version: "3"

vars:
  WEB_DIR: web

tasks:
  install:
    desc: Install all dependencies for a fresh clone (Go modules, npm, Playwright browsers)
    cmds:
      - go mod download
      - task: web:deps
      - task: web:e2e:install

  dev:
    desc: Go server with air hot-reload
    cmds:
      - air

  dev:spa:
    desc: Backend + Vite SPA in parallel
    deps: [web:deps]
    cmds:
      - |
        bash -c '
        set -e
        trap "kill 0" INT TERM
        (cd {{.WEB_DIR}} && npm run dev) &
        air &
        wait
        '

  web:dev:
    desc: Vite dev server only
    deps: [web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run dev

  web:deps:
    desc: Install frontend deps if missing
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm install
    status:
      - test -d node_modules

  build:
    desc: Production binary (SPA + Go)
    deps: [web:build]
    cmds:
      - CGO_ENABLED=0 go build -o damson ./cmd/server

  web:build:
    desc: Build SPA into web/static
    deps: [web:deps]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  fmt:
    desc: go fmt
    cmds:
      - go fmt ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  mod:tidy:check:
    desc: Verify go.mod / go.sum are tidy (matches CI)
    cmds:
      - |
        bash -c '
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! cmp -s go.mod go.mod.bak || ! cmp -s go.sum go.sum.bak; then
            echo "go.mod / go.sum are not tidy. Run: go mod tidy && git add go.mod go.sum" >&2
            diff -u go.mod.bak go.mod >&2 || true
            mv go.mod.bak go.mod
            mv go.sum.bak go.sum
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
        '

  test:
    desc: go test
    cmds:
      - go test ./...

  test:short:
    desc: Non-verbose Go tests
    cmds:
      - go test -count=1 ./...

  test:coverage:
    desc: Generate coverage.html
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test:integration:
    desc: Postgres-backed integration tests (boots compose Postgres on 55432)
    cmds:
      - |
        bash -c '
          set -euo pipefail
          compose="docker compose -f database/test/compose.postgres.yaml"
          trap "$compose down -v >/dev/null 2>&1 || true" EXIT
          $compose up -d --wait
          export DAMSON_TEST_POSTGRES_DSN="postgres://damson:damson@localhost:55432/damson?sslmode=disable"
          go test -tags=postgres_integration -count=1 -race ./...
        '

  web:test:
    desc: Vitest unit tests (jsdom)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm test -- --run

  web:test:stories:
    desc: Run Storybook stories as Vitest tests (Playwright Chromium)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run test:stories -- --run

  web:test:all:
    desc: All Vitest projects (unit + stories)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run test:all -- --run

  web:e2e:
    desc: Playwright end-to-end tests (boots e2e-server + vite dev internally)
    deps: [web:deps, web:e2e:build]
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run e2e

  web:e2e:build:
    desc: Build the SQLite-backed test server (cmd/e2e-server) into web/e2e/.bin
    cmds:
      - mkdir -p {{.WEB_DIR}}/e2e/.bin
      - go build -o {{.WEB_DIR}}/e2e/.bin/damson-e2e ./cmd/e2e-server

  web:e2e:install:
    desc: Install Playwright browser binaries (run once after npm install)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run e2e:install

  web:e2e:ui:
    desc: Playwright UI mode (interactive test runner)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run e2e:ui

  web:storybook:
    desc: Storybook dev server (design system)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run storybook

  web:storybook:build:
    desc: Static Storybook build (smoke test)
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm run build-storybook

  web:test:watch:
    desc: Vitest watch mode
    dir: "{{.WEB_DIR}}"
    deps: [web:deps]
    cmds:
      - npm test

  pre-release-checks:
    desc: fmt + vet + mod-tidy + tests (Go & web) + e2e
    cmds:
      - task: fmt
      - task: vet
      - task: mod:tidy:check
      - task: test
      - task: web:test
      - task: web:e2e

  docker-build:
    desc: Container image
    cmds:
      - docker build -t damson:local .
